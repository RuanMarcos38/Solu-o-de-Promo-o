name: promotion-radar-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.production.secrets
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promo}
      POSTGRES_DB: ${POSTGRES_DB:-promo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promo} -d ${POSTGRES_DB:-promo_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env.production.secrets
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory "${REDIS_MAXMEMORY:-512mb}" --maxmemory-policy "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  migrate:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${API_IMAGE}:${RELEASE_TAG}
    env_file:
      - .env.production
      - .env.production.secrets
    command: ["npm", "run", "prisma:deploy", "-w", "apps/api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  api:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${API_IMAGE}:${RELEASE_TAG}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
      - .env.production.secrets
    expose: ["3333"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]

  worker:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${API_IMAGE}:${RELEASE_TAG}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
      - .env.production.secrets
    command: ["npm", "run", "start:worker", "-w", "apps/api"]
    expose: ["9464"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]

  web:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${WEB_IMAGE}:${RELEASE_TAG}
    restart: unless-stopped
    init: true
    expose: ["80"]
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    security_opt: ["no-new-privileges:true"]

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.33.1}
    restart: unless-stopped
    init: true
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://${GRAFANA_DOMAIN}/alertmanager
    volumes:
      - ./ops/alertmanager/generated/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./ops/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    secrets:
      - alertmanager_smtp_password
      - alertmanager_telegram_bot_token
      - alertmanager_primary_webhook_url
      - alertmanager_secondary_webhook_url
      - alertmanager_warning_webhook_url
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.1}
    restart: unless-stopped
    init: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.example.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    secrets:
      - promotion_radar_metrics_token
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      alertmanager:
        condition: service_healthy
    networks: [backend, observability]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.0}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN_FORM:-false}
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OAUTH_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: ${GRAFANA_OAUTH_NAME:-SSO}
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "false"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/grafana_oauth_client_secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: ${GRAFANA_OAUTH_SCOPES:-openid profile email groups}
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OAUTH_AUTH_URL:-}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GRAFANA_OAUTH_TOKEN_URL:-}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GRAFANA_OAUTH_API_URL:-}
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: ${GRAFANA_OAUTH_ROLE_ATTRIBUTE_PATH:-Viewer}
      GF_AUTH_GENERIC_OAUTH_ALLOWED_DOMAINS: ${GRAFANA_OAUTH_ALLOWED_DOMAINS:-}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    secrets:
      - grafana_admin_password
      - grafana_oauth_client_secret
    depends_on:
      prometheus:
        condition: service_healthy
    expose: ["3000"]
    networks: [edge, observability]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 15
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
      grafana:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: ["no-new-privileges:true"]

networks:
  edge:
  backend:
    internal: true
  observability:
    internal: true

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  caddy_data:
  caddy_config:

secrets:
  promotion_radar_metrics_token:
    file: ./deploy/secrets/promotion_radar_metrics_token
  grafana_admin_password:
    file: ./deploy/secrets/grafana_admin_password
  grafana_oauth_client_secret:
    file: ./deploy/secrets/grafana_oauth_client_secret
  alertmanager_smtp_password:
    file: ./deploy/secrets/alertmanager_smtp_password
  alertmanager_telegram_bot_token:
    file: ./deploy/secrets/alertmanager_telegram_bot_token
  alertmanager_primary_webhook_url:
    file: ./deploy/secrets/alertmanager_primary_webhook_url
  alertmanager_secondary_webhook_url:
    file: ./deploy/secrets/alertmanager_secondary_webhook_url
  alertmanager_warning_webhook_url:
    file: ./deploy/secrets/alertmanager_warning_webhook_url
