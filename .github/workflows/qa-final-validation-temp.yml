name: Fix QA OAuth assertion

on:
  push:
    branches: [qa/full-button-backend-audit]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-button-backend-audit
          fetch-depth: 0
      - name: Ajustar asserção OAuth
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/qa-ui-buttons.mjs')
          text = p.read_text()
          pattern = r"    const startResponse = await startResponsePromise;.*?await oauthPage\.waitForURL\(\(url\) => url\.hostname === 'auth\.mercadolivre\.com\.br', \{ timeout: 8000 \}\);"
          replacement = "    const startResponse = await startResponsePromise;" + chr(10) + "    if (startResponse.status() !== 200) throw new Error(`oauth/start retornou HTTP ${startResponse.status()}`);" + chr(10) + "    await oauthPage.waitForURL((url) => url.hostname === 'auth.mercadolivre.com.br', { timeout: 8000 });"
          updated, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Bloco OAuth não encontrado')
          p.write_text(updated)
          PY
          node --check scripts/qa-ui-buttons.mjs
      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/qa-ui-buttons.mjs
          git commit -m 'Corrige assercao OAuth do QA visual'
          git push origin HEAD:qa/full-button-backend-audit
