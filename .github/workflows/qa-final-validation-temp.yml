name: Fix QA OAuth assertion

on:
  push:
    branches: [qa/full-button-backend-audit]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-button-backend-audit
          fetch-depth: 0
      - name: Ajustar asserção OAuth
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/qa-ui-buttons.mjs')
          text = p.read_text()
          old = """    const startResponse = await startResponsePromise;
    if (startResponse.status() !== 200) throw new Error(`oauth/start retornou HTTP ${startResponse.status()}`);
    const payload = await startResponse.json().catch(() => ({}));
    if (!payload?.authUrl) throw new Error('oauth/start não retornou authUrl');
    const authUrl = new URL(payload.authUrl);
    if (authUrl.hostname !== 'auth.mercadolivre.com.br') throw new Error(`host OAuth inesperado: ${authUrl.hostname}`);
    await oauthPage.waitForURL((url) => url.hostname === 'auth.mercadolivre.com.br', { timeout: 8000 });"""
          new = """    const startResponse = await startResponsePromise;
    if (startResponse.status() !== 200) throw new Error(`oauth/start retornou HTTP ${startResponse.status()}`);
    await oauthPage.waitForURL((url) => url.hostname === 'auth.mercadolivre.com.br', { timeout: 8000 });"""
          if old not in text:
              raise SystemExit('Bloco OAuth não encontrado')
          p.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/qa-ui-buttons.mjs
      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/qa-ui-buttons.mjs
          git commit -m 'Corrige assercao OAuth do QA visual'
          git push origin HEAD:qa/full-button-backend-audit
