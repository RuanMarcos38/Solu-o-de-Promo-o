name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://promo:promo@localhost:5432/promo_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-with-at-least-32-characters
      CHANNEL_CONFIG_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      BOOTSTRAP_ADMIN_ENABLED: "false"
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --loglevel=error

      - name: Prisma generate
        run: npm run db:generate

      - name: API typecheck
        run: npm run lint -w apps/api

      - name: Web typecheck
        run: npm run lint -w apps/web

      - name: Validate observability assets
        run: npm run observability:validate

      - name: Prepare observability validation fixtures
        run: |
          cp .env.example .env
          mkdir -p ops/alertmanager/generated ops/observability/secrets
          cp ops/alertmanager/alertmanager.example.yml ops/alertmanager/generated/alertmanager.yml
          printf '%s\n' 'ci-metrics-token-with-more-than-24-characters' > ops/observability/secrets/promotion_radar_metrics_token
          printf '%s\n' 'ci-grafana-password' > ops/observability/secrets/grafana_admin_password
          printf '%s\n' 'ci-smtp-password' > ops/observability/secrets/alertmanager_smtp_password
          printf '%s\n' 'ci-telegram-token' > ops/observability/secrets/alertmanager_telegram_bot_token
          printf '%s\n' 'https://example.invalid/primary' > ops/observability/secrets/alertmanager_primary_webhook_url
          printf '%s\n' 'https://example.invalid/secondary' > ops/observability/secrets/alertmanager_secondary_webhook_url
          printf '%s\n' 'https://example.invalid/warning' > ops/observability/secrets/alertmanager_warning_webhook_url
          chmod 600 ops/observability/secrets/* ops/alertmanager/generated/alertmanager.yml

      - name: Prometheus configuration check
        run: >-
          docker run --rm
          -v "$PWD/ops/prometheus:/etc/prometheus:ro"
          -v "$PWD/ops/observability/secrets:/run/secrets:ro"
          --entrypoint /bin/promtool
          prom/prometheus:v3.13.1
          check config /etc/prometheus/prometheus.example.yml

      - name: Alertmanager configuration check
        run: >-
          docker run --rm
          -v "$PWD/ops/alertmanager:/etc/alertmanager:ro"
          -v "$PWD/ops/observability/secrets:/run/secrets:ro"
          --entrypoint /bin/amtool
          prom/alertmanager:v0.33.1
          check-config /etc/alertmanager/alertmanager.example.yml

      - name: Observability compose profile check
        run: docker compose --profile observability config > /dev/null

      - name: Unit tests
        run: npm run test:unit -w apps/api

      - name: API build
        run: npm run build -w apps/api

      - name: Web build
        run: npm run build -w apps/web

      - name: Capture production dependency audit
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > npm-audit.json
          echo $? > npm-audit-exit-code.txt
          exit 0

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-production-audit
          path: |
            npm-audit.json
            npm-audit-exit-code.txt
          retention-days: 14

      - name: Fail on high dependency vulnerabilities
        run: test "$(cat npm-audit-exit-code.txt)" = "0"

  integration:
    name: Integration tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: promo
          POSTGRES_PASSWORD: promo
          POSTGRES_DB: promo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promo -d promo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://promo:promo@localhost:5432/promo_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-with-at-least-32-characters
      JWT_EXPIRES_IN: 15m
      JWT_ISSUER: promotion-radar-api-test
      JWT_AUDIENCE: promotion-radar-web-test
      FRONTEND_ORIGINS: http://localhost:5173
      BOOTSTRAP_ADMIN_ENABLED: "true"
      ADMIN_NAME: Administrador de Teste
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: TestAdminPassword123!
      CHANNEL_CONFIG_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      ALLOW_INSECURE_OUTBOUND_HTTP: "false"
      COLLECT_INTERVAL_SECONDS: "3600"
      NODE_V8_COVERAGE: ${{ github.workspace }}/coverage
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --loglevel=error

      - name: Prisma generate
        run: npm run db:generate

      - name: Apply migrations
        run: npm run prisma:deploy -w apps/api

      - name: Integration tests with coverage
        run: npm run test:coverage -w apps/api

      - name: Upload V8 coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-v8-coverage
          path: coverage
          if-no-files-found: error
          retention-days: 14
