name: Fix final QA blockers

on:
  push:
    branches: [qa/full-button-backend-audit]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-button-backend-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Corrigir bloqueios funcionais
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Padrão não encontrado ou ambíguo em {path}: {pattern[:80]}')
              p.write_text(updated)

          sub_once(
              'apps/api/src/bootstrap.ts',
              r"async function validateConfiguredUrl\(value: unknown\) \{.*?\n\}",
              """async function validateConfiguredUrl(value: unknown) {
            if (typeof value !== 'string' || !value.trim()) return;
            try {
              await assertSafeOutboundUrl(value.trim());
            } catch (error) {
              const detail = error instanceof Error ? error.message : 'URL externa inválida';
              throw Object.assign(new Error(`URL do canal inválida ou inacessível: ${detail}`), { statusCode: 400 });
            }
          }"""
          )

          sub_once(
              'apps/web/src/App.tsx',
              r"  async function createChannel\(type: string\) \{.*?\n  \}\n\n  async function toggleChannel",
              """  async function createChannel(type: string) {
            let parsedConfig: Record<string, unknown>;
            try {
              parsedConfig = JSON.parse(channelConfig) as Record<string, unknown>;
            } catch {
              setStatusMessage('Configuração JSON do canal é inválida.');
              return;
            }

            setStatusMessage('');
            try {
              await apiFetch('/dispatch/channels', {
                method: 'POST',
                body: JSON.stringify({ name: `Canal ${type}`, type, config: parsedConfig })
              });
              setStatusMessage(`Canal ${type} criado com configuração protegida.`);
              await loadAdminData();
            } catch (error) {
              setStatusMessage(error instanceof Error ? error.message : 'Não foi possível criar o canal.');
            }
          }

          async function toggleChannel"""
          )

          sub_once(
              'apps/web/src/enterprise-operational-2026.css',
              r"/\* Central de afiliados \*/\s*\.affiliate-hub-launcher \{.*?\}",
              """/* Central de afiliados */
          .affiliate-hub-launcher {
            display: inline-flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            z-index: 190 !important;
          }"""
          )

          sub_once(
              'scripts/qa-ui-buttons.mjs',
              r"if \(response\.status\(\) === 400\) \{\s*const body = await response\.json\(\)\.catch\(\(\) => \(\{\}\)\);\s*if \(!/canal\.\*whatsapp\|evolution\|nenhum canal/i\.test\(String\(body\?\.message \?\? ''\)\)\) \{\s*throw new Error\('bloqueio de envio sem canal nao retornou mensagem clara'\);\s*\}\s*\}",
              """if (response.status() === 400) {
                const body = await response.json().catch(() => ({}));
                if (!/canal|whatsapp|evolution|afiliar|afiliad/i.test(String(body?.message ?? ''))) {
                  throw new Error('bloqueio de envio sem canal ou afiliação não retornou mensagem clara');
                }
              }"""
          )

          sub_once(
              'scripts/qa-ui-buttons.mjs',
              r"    await step\(`Criar canal \$\{type\}`, async \(\) => \{\s*const responsePromise = waitApi\(page, '/dispatch/channels', 'POST'\);\s*await clickButton\(page\.getByRole\('button', \{ name: createButton, exact: true \}\), createButton\);\s*const response = await responsePromise;\s*if \(!\[200, 201\]\.includes\(response\.status\(\)\)\) throw new Error\(`criar canal \$\{type\} HTTP \$\{response\.status\(\)\}`\);\s*\}\);",
              """    await step(`Criar canal ${type}`, async () => {
                if (type === 'webhook') {
                  await textarea.fill('{\"url\":\"https://example.com/qa-webhook\"}');
                }
                if (type === 'evolution') {
                  await textarea.fill('{\"baseUrl\":\"https://example.com\",\"apiKey\":\"qa-key\",\"instanceName\":\"qa-instance\",\"number\":\"5511999999999\",\"audience\":\"private\"}');
                }
                const responsePromise = waitApi(page, '/dispatch/channels', 'POST');
                await clickButton(page.getByRole('button', { name: createButton, exact: true }), createButton);
                const response = await responsePromise;
                if (![200, 201].includes(response.status())) throw new Error(`criar canal ${type} HTTP ${response.status()}`);
              });"""
          )

          sub_once(
              'scripts/qa-backend-functional.mjs',
              r"await check\('Listar canais', '/dispatch/channels'\);\s*await check\('Historico de envios', '/dispatch/logs\?limit=20'\);",
              """await check('Listar canais', '/dispatch/channels');
          await check('Rejeitar URL inválida de canal com erro de validação', '/dispatch/channels', {
            method: 'POST',
            body: {
              name: `QA URL inválida ${runId}`,
              type: 'webhook',
              isActive: true,
              config: { url: 'https://host-inexistente-qa.invalid/webhook' }
            }
          }, [400]);
          await check('Historico de envios', '/dispatch/logs?limit=20');"""
          )
          PY
      - name: Instalar dependências
        run: npm ci --loglevel=error
      - name: Validar compilação e testes unitários
        run: |
          npm run db:generate
          npm run build -w apps/api
          npm run build -w apps/web
          npm run test:unit -w apps/api
      - name: Commitar correções
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/bootstrap.ts apps/web/src/App.tsx apps/web/src/enterprise-operational-2026.css scripts/qa-ui-buttons.mjs scripts/qa-backend-functional.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Corrige bloqueios finais de canais e Central de Afiliados'
          git push origin HEAD:qa/full-button-backend-audit
