name: API Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-hero-media:
    name: Validate Hero media with FFmpeg
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/hero-video-background' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/hero-video-background
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate complete video and poster decoding
        shell: bash
        run: |
          set -euo pipefail

          VIDEO='apps/web/public/media/hero-background.mp4'
          POSTER='apps/web/public/media/hero-poster.jpg'

          test -s "$VIDEO"
          test -s "$POSTER"

          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          AUDIO_STREAMS="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$VIDEO" | sed '/^$/d' | wc -l)"

          test "$CODEC" = 'h264'
          test "$WIDTH" = '1280'
          test "$HEIGHT" = '720'
          test "$AUDIO_STREAMS" = '0'

          ffmpeg -v error -i "$VIDEO" -f null -
          ffmpeg -v error -i "$POSTER" -frames:v 1 -f null -

          {
            echo 'Hero media validation: PASSED'
            echo "codec=${CODEC}"
            echo "width=${WIDTH}"
            echo "height=${HEIGHT}"
            echo "fps=${FPS}"
            echo "duration=${DURATION}"
            echo "audio_streams=${AUDIO_STREAMS}"
            echo "video_size=$(stat -c%s "$VIDEO")"
            echo "poster_size=$(stat -c%s "$POSTER")"
            sha256sum "$VIDEO" "$POSTER"
          } > docs/HERO_MEDIA_VALIDATION.txt

          cat docs/HERO_MEDIA_VALIDATION.txt

      - name: Restore workflow and commit validation
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/api-diagnostics.yml > .github/workflows/api-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/api-diagnostics.yml docs/HERO_MEDIA_VALIDATION.txt
          git commit -m 'test: verify Hero media with FFmpeg'
          git push origin HEAD:feature/hero-video-background

  api-typecheck-diagnostics:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://promo:promo@localhost:5432/promo_db?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --loglevel=error

      - name: Prisma generate
        run: npm run db:generate

      - name: Capture API typecheck output
        run: |
          set +e
          npm run lint -w apps/api > api-typecheck.log 2>&1
          echo $? > api-typecheck-exit-code.txt
          cat api-typecheck.log
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: api-typecheck-diagnostics
          path: |
            api-typecheck.log
            api-typecheck-exit-code.txt

      - name: Fail when API typecheck fails
        run: test "$(cat api-typecheck-exit-code.txt)" = "0"
