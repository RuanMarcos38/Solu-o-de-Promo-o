name: Fix empty JSON POST

on:
  push:
    branches: [qa/full-button-backend-audit]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-button-backend-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Corrigir Content-Type em requisições sem corpo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(path, pattern, transform, label):
              p = Path(path)
              text = p.read_text()
              match = re.search(pattern, text, flags=re.S)
              if not match:
                  raise SystemExit(f'Padrão não encontrado: {label}')
              replacement = transform(match)
              p.write_text(text[:match.start()] + replacement + text[match.end():])

          patch(
              'apps/web/src/App.tsx',
              r"async function apiFetch\(path: string, options: RequestInit = \{\}\) \{.*?const headers: Record<string, string> = \{\s*'Content-Type': 'application/json',\s*\.\.\.\(options\.headers as Record<string, string> \| undefined\)\s*\};",
              lambda m: m.group(0).replace(
                  "'Content-Type': 'application/json',",
                  "...(options.body !== undefined ? { 'Content-Type': 'application/json' } : {}),",
                  1
              ),
              'apiFetch App.tsx'
          )

          patch(
              'apps/web/src/AffiliateHub.tsx',
              r"async function request\(path: string, options: RequestInit = \{\}\) \{.*?headers: \{\s*'Content-Type': 'application/json',\s*Authorization: `Bearer \$\{token\}`,\s*\.\.\.\(options\.headers \?\? \{\}\)\s*\}",
              lambda m: m.group(0).replace(
                  "'Content-Type': 'application/json',",
                  "...(options.body !== undefined ? { 'Content-Type': 'application/json' } : {}),",
                  1
              ),
              'request AffiliateHub.tsx'
          )

          p = Path('scripts/qa-ui-buttons.mjs')
          text = p.read_text()
          old = r"(?:Buscando|Afiliando|Enviando|Aplicando|Salvando|Processando|Executando|Entrando|Atualizando)\.\."
          new = r"(?:Buscando|Afiliando|Enviando|Aplicando|Salvando|Processando|Executando|Entrando|Atualizando)\.\.\."
          if old not in text:
              raise SystemExit('Padrão de inventário dinâmico não encontrado')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Instalar dependências
        run: npm ci --loglevel=error
      - name: Validar frontend e QA
        run: |
          npm run build -w apps/web
          node --check scripts/qa-ui-buttons.mjs
      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/App.tsx apps/web/src/AffiliateHub.tsx scripts/qa-ui-buttons.mjs
          git commit -m 'Corrige POST sem corpo e desbloqueia OAuth e WhatsApp'
          git push origin HEAD:qa/full-button-backend-audit
