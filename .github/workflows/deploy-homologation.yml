name: Deploy Homologation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release candidate já publicada no GHCR
        required: true
        default: v0.1.0-rc.1
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-homologation
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: homologation
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure trusted host key
        env:
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy release on VPS
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          REMOTE_APP_DIR: ${{ vars.REMOTE_APP_DIR }}
        run: |
          ssh -p "${VPS_SSH_PORT:-22}" "$VPS_SSH_USER@$VPS_SSH_HOST" \
            "cd '${REMOTE_APP_DIR:-/opt/promotion-radar}' && git fetch --all --prune && git checkout main && git pull --ff-only && bash scripts/deploy-production.sh '$RELEASE_TAG'"

      - name: Public smoke test
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          GRAFANA_DOMAIN: ${{ vars.GRAFANA_DOMAIN }}
        run: |
          cp deploy/homologation.env.example deploy/homologation.env
          sed -i \
            -e "s|^APP_DOMAIN=.*|APP_DOMAIN=$APP_DOMAIN|" \
            -e "s|^API_DOMAIN=.*|API_DOMAIN=$API_DOMAIN|" \
            -e "s|^GRAFANA_DOMAIN=.*|GRAFANA_DOMAIN=$GRAFANA_DOMAIN|" \
            deploy/homologation.env
          bash scripts/go-live-smoke.sh deploy/homologation.env
