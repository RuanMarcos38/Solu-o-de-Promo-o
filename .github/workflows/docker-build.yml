name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run application and observability smoke test
        run: bash scripts/ci-observability-smoke.sh

      - name: Upload observability smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-smoke-diagnostics
          path: |
            prometheus-targets.json
            prometheus-query.json
            prometheus-smoke-result.txt
            grafana-search.json
            grafana-smoke-result.txt
            api-metrics.txt
            worker-metrics.txt
            observability-containers.log
          if-no-files-found: warn
          retention-days: 14
