name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Build API image
        run: docker compose build api

      - name: Build worker image
        run: docker compose build worker

      - name: Build web image
        run: docker compose build web

      - name: Build migrate image
        run: docker compose build migrate

      - name: Start dependencies
        run: docker compose up -d postgres redis

      - name: Run migrations
        run: docker compose run --rm migrate

      - name: Start services
        run: docker compose up -d api worker

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3333/health; then exit 0; fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: API healthcheck
        run: curl -fsS http://localhost:3333/health

      - name: API readiness
        run: curl -fsS http://localhost:3333/ready

      - name: Worker observability healthcheck
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:9464/health; then exit 0; fi
            sleep 2
          done
          docker compose logs worker
          exit 1

      - name: Worker Prometheus metrics
        run: |
          curl -fsS http://localhost:9464/metrics > worker-metrics.txt
          grep -q 'promotion_radar_queue_depth' worker-metrics.txt
          grep -q 'promotion_radar_service_info' worker-metrics.txt

      - name: Public API smoke test
        run: node scripts/smoke-public.mjs

      - name: Logs on failure
        if: failure()
        run: docker compose logs
