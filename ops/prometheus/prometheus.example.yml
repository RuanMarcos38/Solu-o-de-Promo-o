global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/promotion-radar-slo.yml

scrape_configs:
  - job_name: promotion-radar-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/promotion_radar_metrics_token
    static_configs:
      - targets: ["api:3333"]
        labels:
          process_role: api

  - job_name: promotion-radar-worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/promotion_radar_metrics_token
    static_configs:
      - targets: ["worker:9464"]
        labels:
          process_role: worker
